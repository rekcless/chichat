<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Chatting</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <!-- =========================
       AUTH
  ========================== -->

  <main id="authSection" class="auth-section">

    <div class="auth-card">

      <div class="logo">
        💬
      </div>

      <h1>Chatting</h1>

      <p class="subtitle">
        Chat dengan teman dengan mudah
      </p>

      <div class="form-group">

        <label for="usernameAuth">
          Username
        </label>

        <input
          type="text"
          id="usernameAuth"
          placeholder="Masukkan username"
          autocomplete="username"
        >

      </div>


      <div class="form-group">

        <label for="passwordAuth">
          Password
        </label>

        <input
          type="password"
          id="passwordAuth"
          placeholder="Masukkan password"
          autocomplete="current-password"
        >

      </div>


      <div class="auth-buttons">

        <button
          type="button"
          id="loginBtn"
          class="btn btn-primary"
        >
          Masuk
        </button>

        <button
          type="button"
          id="registerBtn"
          class="btn btn-secondary"
        >
          Daftar
        </button>

      </div>

      <p class="auth-info">
        Belum punya akun? Klik <b>Daftar</b>
      </p>

    </div>

  </main>


  <!-- =========================
       FRIEND SECTION
  ========================== -->

  <section
    id="friendSection"
    class="friend-section"
    style="display:none;"
  >

    <div class="container">

      <header class="topbar">

        <div>
          <h2>Chatting</h2>

          <p>
            Teman kamu
          </p>
        </div>

        <button
          type="button"
          id="logoutBtn"
          class="logout-btn"
        >
          Keluar
        </button>

      </header>


      <div class="add-friend">

        <input
          type="text"
          id="searchUser"
          placeholder="Masukkan username teman..."
        >

        <button
          type="button"
          id="addFriendBtn"
        >
          + Tambah
        </button>

      </div>


      <div class="friends-card">

        <h3>Daftar Teman</h3>

        <ul id="friendList">
        </ul>

      </div>

    </div>

  </section>


  <!-- =========================
       CHAT SECTION
  ========================== -->

  <section
    id="chatSection"
    class="chat-section"
    style="display:none;"
  >

    <div class="chat-container">

      <header class="chat-header">

        <div>

          <span class="chat-label">
            Sedang chat dengan
          </span>

          <h3 id="chatWithName">
            -
          </h3>

        </div>

      </header>


      <div
        id="chatBox"
        class="chat-box"
      >
      </div>


      <div class="chat-input">

        <textarea
          id="chatMessage"
          placeholder="Tulis pesan..."
          rows="1"
        ></textarea>

        <button
          type="button"
          id="sendChatBtn"
        >
          ➤
        </button>

      </div>

    </div>

  </section>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script type="module" src="./app.js"></script>

</body>
</html>
